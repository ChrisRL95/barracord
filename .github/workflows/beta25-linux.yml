name: Barracord beta.25 Linux
on:
  push:
    branches: [ci/beta25-linux]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_LIVEKIT_URL: ${{ vars.BARRACORD_BETA25_LIVEKIT_URL }}
      VITE_TOKEN_ENDPOINT: ${{ vars.BARRACORD_BETA25_TOKEN_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fc426778adac212cb800359b4c74698a05567746
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm libfuse2t64
      - run: npm ci
      - run: |
          test -n "$VITE_LIVEKIT_URL" && test -n "$VITE_TOKEN_ENDPOINT"
          npm run build:tailnet
          npx --no-install electron-builder --linux AppImage rpm --x64 --config electron-builder.guest.json --config.directories.output=release/guest-linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: barracord-beta25-linux
          path: |
            release/guest-linux/*.AppImage
            release/guest-linux/*.rpm
            release/guest-linux/beta-linux.yml
          if-no-files-found: error
          compression-level: 0
