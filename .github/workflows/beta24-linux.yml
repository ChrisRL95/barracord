name: Barracord beta.24 Linux
on:
  push:
    branches: [ci/beta24-linux]
permissions:
  actions: read
  contents: write
jobs:
  attach-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: barracord-beta24-linux
          path: packages
          run-id: 42508650337
          github-token: ${{ github.token }}
      - name: Verify and attach Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: '438426812'
        run: |
          cd packages
          image=Barracord-0.1.0-beta.24-x86_64.AppImage
          rpm=Barracord-0.1.0-beta.24-x86_64.rpm
          hash="$(openssl dgst -sha512 -binary "$image" | openssl base64 -A)"
          grep -Fx 'version: 0.1.0-beta.24' beta-linux.yml
          grep -F "$image" beta-linux.yml
          grep -F "$hash" beta-linux.yml >/dev/null
          test -s "$rpm"
          file "$image" "$rpm"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          jq -e '.draft and .tag_name == "v0.1.0-beta.24" and .target_commitish == "713d4011ec8bf6054e85ffdc19cc4e040a1ce979"' release.json >/dev/null
          for asset in "$image" "$rpm" beta-linux.yml; do
            curl --silent --show-error --fail-with-body --retry 3               -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream"               --data-binary "@$asset" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$asset" > asset.json
            jq -e --arg name "$asset" --argjson size "$(stat -c %s "$asset")" '.state == "uploaded" and .name == $name and .size == $size' asset.json >/dev/null
          done
